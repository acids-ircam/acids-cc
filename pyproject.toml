[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acids-cc"
version = "3.0"
description = "Cached convolution layers for real-time streaming inference with PyTorch (upgrade of Caillon's cached_conv 2021 package)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ACIDS", email = "acids.paris@gmail.com" }, {name = "Axel Chemla--Romeu-Santos"}, {name = "Nils Demerlé"}]
keywords = ["deep learning", "pytorch", "convolution", "streaming", "real-time"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["torch>1.8"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]
docs = ["sphinx>=7", "furo", "myst-parser", "sphinx-copybutton"]

[project.urls]
Documentation = "https://cached-conv.readthedocs.io"
Repository = "https://github.com/acids-ircam/acids-cc"

[tool.setuptools.packages.find]
include = ["cached_conv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
